<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional developer portfolio — projects, skills, and contact."/>
  <title>Portafolio EdwinS</title>

  <!-- Google Fonts: Inter + Fira Code (developer accents) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Russo+One&display=swap"
    rel="stylesheet"
  />

  <!-- Bootstrap 5: grid + utilities; colors overridden in ./css/styles.css -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <!-- devicon.dev -->
  <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

  <!-- Bootstrap icons -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App styles (design tokens first, then section components) -->
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body class="site-body">
  <!--
    NOTE: HTML partials under ./components/ are injected at runtime via ./js/main.js.
    Opening this file directly (file://) may block fetch(); use a static local server
    (e.g. VS Code Live Server) or deploy over HTTPS (e.g. GitHub Pages).
  -->

  <!-- Injected: ./components/navbar.html -->
  <div id="site-navbar" class="site-navbar-root" aria-live="polite"></div>

  <!-- Injected: ./components/hero.html -->
    <div id="site-hero"></div> 

  <main id="top" class="site-main section-surface">
     

    <!-- Injected: ./components/about.html -->
    <div id="site-about"></div>

    <!-- Injected: ./components/projects.html -->
    <div id="site-projects"></div>

    <!-- Injected: ./components/skills.html -->
    <div id="site-skills"></div>

    <!-- Injected: ./components/contact.html -->
    <div id="site-contact"></div>
  </main>

  <footer class="site-footer border-top border-secondary border-opacity-25">
    <div class="container py-4 text-center text-accent-cyan small">
      <span class="font-mono text-accent-cyan">&copy; <span id="footer-year"></span></span>
      <a href="https://github.com/EdwinSanchezA720">Edwin Sánchez</a> — Diseñado y desarrollado con pasión
    </div>
  </footer>

  <!-- Bootstrap bundle (collapse, etc.) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <!-- Scroll animations (Intersection Observer) -->
  <script src="./js/animations.js" defer></script>
  <!-- Component loader, navigation, form handling -->
  <script src="./js/main.js" defer></script>
  <script>
    document.getElementById("footer-year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
